[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-double-entry"
version = "0.1.0"
description = "Immutable, append-only double-entry core banking general ledger with SHA-256 cryptographic chaining"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "aipd506" }
]
keywords = ["ledger", "double-entry", "accounting", "banking", "fintech", "cryptographic-chain", "audit-trail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.scripts]
ledgercore = "ledger_double_entry.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ledger_double_entry*"]
